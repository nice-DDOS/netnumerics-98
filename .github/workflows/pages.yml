name: Build and deploy NetNumerics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetNumerics-98
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/engine.test.cjs
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path rust/Cargo.toml
      - run: |
          mkdir site
          cp index.html style.css engine.js app.js site/
          cp rust/target/wasm32-unknown-unknown/release/netnumerics_core.wasm site/
          node tests/wasm.test.cjs site/netnumerics_core.wasm
      - name: Bundle current interface to avoid stale browser assets
        run: |
          node --check app.js
          node --check engine.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site')
          html = (p / 'index.html').read_text(encoding='utf-8')
          html = html.replace('<link rel="stylesheet" href="style.css">', '<style>' + (p / 'style.css').read_text(encoding='utf-8') + '</style>')
          for name in ('engine.js', 'app.js'):
              html = html.replace('<script src="' + name + '"></script>', '<script>' + (p / name).read_text(encoding='utf-8') + '</script>')
          assert "let nnLang='ar'" in html and 'nnLangButton' in html and '100dvh' in html
          html = html.replace('<span class="task">▣ NetNumerics 98</span>', '<span class="task">▣ NetNumerics 98 · v1.1 AR</span>')
          (p / 'index.html').write_text(html, encoding='utf-8')
          (p / 'ar.html').write_text(html, encoding='utf-8')
          PY
      - name: Browser smoke test (Arabic, English and numerical parity)
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/nn-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:1440,height:900}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/ar.html?lang=ar');
              await page.waitForFunction(()=>document.documentElement.lang==='ar' && document.querySelector('#content h1')?.textContent.includes('نشاط الشبكة'));
              await page.waitForFunction(()=>document.querySelector('#runtime')?.textContent.includes('RUST / WASM'));
              const before=await page.locator('.kpi strong').allTextContents();
              assert.equal(before[0],'34');
              assert.equal(before[1],'26.509');
              assert.equal(before[3],'2,987.6');
              assert.equal(await page.evaluate(()=>getComputedStyle(document.body).overflowY),'hidden');
              await page.locator('#language').click();
              assert.equal(await page.locator('#content h1').innerText(),'Network activity overview');
              assert.deepEqual(await page.locator('.kpi strong').allTextContents(),before);
              await page.locator('#language').click();
              assert.match(await page.locator('#content h1').innerText(),/نشاط الشبكة/);
              await page.locator('.sidebar [data-tab="methods"]').click();
              assert.match(await page.locator('#content h1').innerText(),/الطرق العددية/);
              assert.deepEqual(errors,[]);
              console.log('PASS: Arabic/English toggle, unchanged KPIs, WASM, compact desktop and navigation');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: NetNumerics-98/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
