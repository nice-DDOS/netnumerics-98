name: Build and deploy NetNumerics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetNumerics-98
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/engine.test.cjs
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path rust/Cargo.toml
      - run: |
          mkdir site
          cp index.html style.css engine.js app.js site/
          cp rust/target/wasm32-unknown-unknown/release/netnumerics_core.wasm site/
          node tests/wasm.test.cjs site/netnumerics_core.wasm
      - name: Bundle current interface to avoid stale browser assets
        run: |
          node --check app.js
          node --check engine.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site')
          html = (p / 'index.html').read_text(encoding='utf-8')
          html = html.replace('<link rel="stylesheet" href="style.css">', '<style>' + (p / 'style.css').read_text(encoding='utf-8') + '</style>')
          for name in ('engine.js', 'app.js'):
              html = html.replace('<script src="' + name + '"></script>', '<script>' + (p / name).read_text(encoding='utf-8') + '</script>')
          assert "let nnLang='ar'" in html and 'nnLangButton' in html and '100dvh' in html
          html = html.replace('<span class="task">▣ NetNumerics 98</span>', '<span class="task">▣ NetNumerics 98 · v1.2 DFIR</span>')
          (p / 'index.html').write_text(html, encoding='utf-8')
          (p / 'ar.html').write_text(html, encoding='utf-8')
          PY
      - name: Generate verified offline packet capture fixture
        run: |
          python3 - <<'PY'
          import struct, socket
          from pathlib import Path
          def checksum(data):
              if len(data)%2: data+=b'\0'
              s=sum(struct.unpack('!%dH'%(len(data)//2),data))
              while s>>16: s=(s&65535)+(s>>16)
              return (~s)&65535
          rates=[10]*25+[10+2*(i+1) for i in range(10)]+[30]*15+[10]*10
          path=Path('site/NetNumerics-Lab-Sample.pcap')
          with path.open('wb') as f:
              f.write(struct.pack('<IHHIIII',0xa1b2c3d4,2,4,0,0,65535,1))
              i=0
              for sec,n in enumerate(rates+[1]):
                  for k in range(n):
                      dst,port=('192.0.2.20',9000) if k<10 else ('192.0.2.30',9001)
                      payload=b'NETNUMERICS OFFLINE LAB'
                      udp=struct.pack('!HHHH',49152,port,8+len(payload),0)+payload
                      ip=struct.pack('!BBHHHBBH4s4s',0x45,0,20+len(udp),i%65536,0,64,17,0,socket.inet_aton('192.0.2.10'),socket.inet_aton(dst))
                      ip=ip[:10]+struct.pack('!H',checksum(ip))+ip[12:]
                      pkt=bytes.fromhex('0200000000020200000000010800')+ip+udp
                      f.write(struct.pack('<IIII',1700000000+sec,k*1000000//n,len(pkt),len(pkt))+pkt)
                      i+=1
          assert i==1011 and path.stat().st_size==81915
          PY
      - name: Browser smoke test (Arabic, English and numerical parity)
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/nn-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:1440,height:900}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/ar.html?lang=ar&tab=dashboard');
              await page.waitForFunction(()=>document.documentElement.lang==='ar' && document.querySelector('#content h1')?.textContent.includes('نشاط الشبكة'));
              await page.waitForFunction(()=>document.querySelector('#runtime')?.textContent.includes('RUST / WASM'));
              const before=await page.locator('.kpi strong').allTextContents();
              assert.equal(before[0],'34');
              assert.equal(before[1],'26.509');
              assert.equal(before[3],'2,987.6');
              assert.equal(await page.evaluate(()=>getComputedStyle(document.body).overflowY),'hidden');
              await page.locator('#language').click();
              assert.equal(await page.locator('#content h1').innerText(),'Network activity overview');
              assert.deepEqual(await page.locator('.kpi strong').allTextContents(),before);
              await page.locator('#language').click();
              assert.match(await page.locator('#content h1').innerText(),/نشاط الشبكة/);
              await page.locator('.sidebar [data-tab="methods"]').click();
              assert.match(await page.locator('#content h1').innerText(),/الطرق العددية/);
              await page.locator('.sidebar [data-tab="capture"]').click();
              await page.locator('#capFile').setInputFiles('site/NetNumerics-Lab-Sample.pcap');
              await page.locator('#capOpen').click();
              await page.locator('#capN').waitFor();
              await page.locator('#capN').fill('20');
              await page.locator('#capLimit').fill('5');
              await page.locator('#capVerified').check();
              await page.locator('#capAnalyze').click();
              await page.locator('.kpi strong').first().waitFor();
              assert.deepEqual(await page.locator('.kpi strong').allTextContents(),['23','26.5','410','0']);
              assert.match(await page.locator('#content').innerText(),/192\.0\.2\.30/);
              const downloadEvent=page.waitForEvent('download');
              await page.locator('#capReport').click();
              const report=JSON.parse(require('node:fs').readFileSync(await (await downloadEvent).path(),'utf8'));
              assert.equal(report.packets,1011);
              assert.equal(report.matchingCompleteIntervalPackets,1010);
              assert.equal(report.flaggedIntervalStarts.length,23);
              assert.equal(report.destinationEvidence[0][0],'192.0.2.30 / UDP:9001');
              assert.equal(report.destinationEvidence[0][1],404);
              await page.locator('#language').click();
              assert.match(await page.locator('#content h1').innerText(),/Network capture investigation/);
              assert.deepEqual(await page.locator('.kpi strong').allTextContents(),['23','26.5','410','0']);
              await page.locator('#capFile').setInputFiles('site/NetNumerics-Lab-Sample.pcap');
              await page.locator('#capTarget').fill('192.0.2.20');
              await page.locator('#capOpen').click();
              await page.waitForFunction(()=>document.querySelector('#capAnalyze')&&!document.querySelector('.kpi'));
              await page.locator('#capN').fill('20');
              await page.locator('#capLimit').fill('5');
              await page.locator('#capAnalyze').click();
              assert.equal(await page.locator('.kpi strong').first().innerText(),'0');
              console.log('PASS: PCAP import, numerical results, JSON evidence, bilingual UI and destination filter');
              await page.goto('http://127.0.0.1:8765/ar.html?lang=ar&mode=beginner');
              await page.locator('#nnCapture').waitFor();
              assert.match(await page.locator('#content h1').innerText(),/حلّل ملف الشبكة/);
              await page.locator('#nnTryDemo').click();
              await page.locator('.nn-case').waitFor();
              assert.equal(await page.locator('.nn-case .kpi strong').first().innerText(),'1,011');
              const beginnerKPIs=await page.locator('.nn-case .kpi strong').allTextContents();
              await page.locator('#language').click();
              assert.equal(await page.locator('#content h1').innerText(),'Investigate a network capture');
              assert.deepEqual(await page.locator('.nn-case .kpi strong').allTextContents(),beginnerKPIs);
              await page.locator('#nnMode').click();
              await page.locator('#forensicFile').waitFor();
              assert.equal(await page.locator('.kpi strong').first().innerText(),'1,011');
              await page.locator('#nnMode').click();
              await page.locator('.nn-case').waitFor();
              assert.deepEqual(await page.locator('.nn-case .kpi strong').allTextContents(),beginnerKPIs);
              console.log('PASS: beginner landing, sample capture, language switch and analyst mode');
              assert.deepEqual(errors,[]);
              console.log('PASS: Arabic/English toggle, unchanged KPIs, WASM, compact desktop and navigation');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: NetNumerics-98/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
